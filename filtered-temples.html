s<!DOCTYPE html>
<html lang="en-US">
  <head>

      name="description"
      content="Explore temples around the world and filter them by age and size."

    <meta name="author" content="Emmanuel Kolawole" />
    <title>Filtered Temple Album | Emmanuel Kolawole</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="stylesheet" href="styles/filtered-temples.css" />

  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="filtered-temples.html" data-filter="home">Temple Album</a>

          type="button"
          aria-label="Open navigation"

        </p>
      </section>

      <p id="results-status" class="results-status" aria-live="polite"></p>
      <section id="gallery" class="gallery" aria-label="Temple collection"></section>

    <footer class="site-footer">
